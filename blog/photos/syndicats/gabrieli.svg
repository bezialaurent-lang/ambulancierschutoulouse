<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- Fond -->
  <rect width="200" height="220" rx="12" fill="#003189"/>
  
  <!-- Sigle CD31 -->
  <circle cx="100" cy="70" r="48" fill="none" stroke="#FFD700" stroke-width="4"/>
  <text x="100" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#FFD700">CD</text>
  <text x="100" y="84" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#FFD700">31</text>
  
  <!-- Croix occitane stylisée -->
  <text x="100" y="108" text-anchor="middle" font-family="serif" font-size="14" fill="#FFD700">✤</text>
  
  <!-- Texte -->
  <text x="100" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">CONSEIL</text>
  <text x="100" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">DÉPARTEMENTAL</text>
  <text x="100" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#FFD700">HAUTE-GARONNE</text>
  
  <!-- Nom -->
  <rect x="10" y="180" width="180" height="28" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="100" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" font-weight="bold" fill="white">Alain GABRIELI</text>
  <text x="100" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#ccc">Vice-Président CD31</text>
</svg>
